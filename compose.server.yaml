# Used by deploy.sh. Separate from the localhost demo stack in compose.yaml.
name: zurvan-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3000"
  DATABASE_URL: postgresql://zurvan:${POSTGRES_PASSWORD:?Run deploy.sh to create .env}@db:5432/zurvan
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run deploy.sh to create .env}
  BETTER_AUTH_URL: https://${DOMAIN:?Run deploy.sh to create .env}
  SHOWCASE_MODE: "true"
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET_NAME: zurvann
  # SeaweedFS has no auth on the private network. The SDK still needs credentials.
  S3_ACCESS_KEY: local
  S3_SECRET_KEY: local
  S3_REGION: us-east-1
  MEDIA_PUBLIC_URL: /media

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zurvan
      POSTGRES_DB: zurvan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy.sh to create .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zurvan -d zurvan"]
      interval: 3s
      timeout: 5s
      retries: 30
    logging: *logging

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=10
      - -s3
    volumes:
      - media:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8888/",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    logging: *logging

  # One-off schema, seed, and storage commands. Never runs during a normal `up`.
  tools:
    profiles: [tools]
    build:
      context: .
      target: development-dependencies-env
    environment: *app-env
    init: true
    logging: *logging

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # The home page reads the catalogue, so this checks the database/schema too.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Run deploy.sh to create .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Mount the directory so a Git update replacing the file is visible on reload.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
