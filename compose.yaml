# Local test stack: Postgres + one-off schema push + the production app server.
# Run with `docker compose up --build`, then open http://localhost:3000.
# No reverse proxy: react-router-serve already serves static assets with compression and caching.

# Pinned so the DB volume survives re-downloading the repo: Compose otherwise derives the project
# (and volume) name from the folder, which changes with ZIP names like `zurvan-main (1)`.
name: zurvan

# Hardcoded rather than `${...}` interpolated: Compose reads the root `.env` for interpolation, and a
# developer's local `.env` points DATABASE_URL at localhost, which is unreachable inside the network.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@db:5432/zurvan
  # Production trusts only this exact origin (see app/lib/auth.server.ts), so it must match the
  # browser URL.
  BETTER_AUTH_URL: http://localhost:3000
  # Local testing only. Never reuse these values in a real deployment.
  BETTER_AUTH_SECRET: local-test-only-auth-secret-0123456789abcdef
  # No SMS provider yet: the sign-in code is always 12345.
  SHOWCASE_MODE: "true"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zurvan
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: avoids clashing with a Postgres already running on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zurvan"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Syncs the Drizzle schema and seeds the showcase, then exits. Uses the dev-deps stage because drizzle-kit is a
  # devDependency. It needs the full env since drizzle.config.ts validates every variable.
  migrate:
    build:
      context: .
      target: development-dependencies-env
    environment: *app-env
    # --force skips drizzle-kit's interactive confirmation, which a container can't answer. Then it seeds the
    # catalogue and the showcase's demo accounts; both seeds are idempotent, so every `up` is safe.
    command: ["sh", "-c", "npx drizzle-kit push --force && npm run db:seed:demo"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment: *app-env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
