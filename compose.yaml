# Local test stack: Postgres + one-off schema push + the production app server.
# Run with `docker compose up --build`, then open http://localhost:3000.
# No reverse proxy: react-router-serve already serves static assets with compression and caching.

# Hardcoded rather than `${...}` interpolated: Compose reads the root `.env` for interpolation, and a
# developer's local `.env` points DATABASE_URL at localhost, which is unreachable inside the network.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@db:5432/zurvan
  # Production trusts only this exact origin (see app/lib/auth.server.ts), so it must match the
  # browser URL. localhost also keeps the page a secure context, which Altcha's Web Crypto needs.
  BETTER_AUTH_URL: http://localhost:3000
  # Local testing only. Never reuse these values in a real deployment.
  BETTER_AUTH_SECRET: local-test-only-auth-secret-0123456789abcdef
  ALTCHA_HMAC_KEY: local-test-only-altcha-key-0123456789abcdef

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zurvan
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: avoids clashing with a Postgres already running on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zurvan"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Syncs the Drizzle schema, then exits. Uses the dev-deps stage because drizzle-kit is a
  # devDependency. It needs the full env since drizzle.config.ts validates every variable.
  migrate:
    build:
      context: .
      target: development-dependencies-env
    environment: *app-env
    # --force skips drizzle-kit's interactive confirmation, which a container can't answer.
    command: ["npx", "drizzle-kit", "push", "--force"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment: *app-env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
